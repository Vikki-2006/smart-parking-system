<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking - Admin Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg-base: #05080B;
            --card-bg: rgba(11, 18, 24, 0.92);
            --input-bg: #090e13;
            --border-subtle: rgba(255, 255, 255, 0.12);
            --border-input: rgba(255, 255, 255, 0.18);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --teal-accent: #00BFAE;
            --teal-hover: #14b8a6;
            --teal-glow: rgba(0, 191, 174, 0.25);

            --status-green: #00C98B;
            --status-amber: #F5A623;
            --status-red: #FF4D4D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.dark-theme {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* High-Contrast Sharp HTML5 Canvas */
        #parkingCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
            background: #05080B;
        }

        /* Subtle Center Shadow behind card (NO page blur) */
        .card-ambient-shadow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 440px; height: 500px;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle, rgba(5, 8, 11, 0.75) 0%, transparent 80%);
        }

        /* Floating Admin Portal Login Panel (Z-Index 10 - Sharpest Element) */
        .login-wrapper {
            width: 100%;
            max-width: 380px;
            z-index: 10;
            position: relative;
            transform: translateY(15px);
            opacity: 0;
            animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }

        .login-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 34px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Brand Header */
        .panel-brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--teal-accent);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .brand-icon-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(0, 191, 174, 0.15);
            border: 1px solid rgba(0, 191, 174, 0.3);
            border-radius: 6px;
            color: var(--teal-accent);
        }

        .portal-tag {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .portal-heading {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .portal-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 22px;
        }

        /* Error Alert */
        .error-alert {
            background: rgba(255, 77, 77, 0.12);
            border: 1px solid rgba(255, 77, 77, 0.35);
            color: #ff6b6b;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Controls */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-input);
            color: var(--text-primary);
            padding: 12px 15px;
            font-size: 0.95rem;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:hover,
        input[type="password"]:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--teal-accent);
            box-shadow: 0 0 0 3px var(--teal-glow);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: var(--teal-accent);
            color: #05080B;
            border: none;
            padding: 13px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: #14d3c3;
            box-shadow: 0 6px 20px var(--teal-glow);
            transform: translateY(-1.5px);
        }

        .submit-btn:active {
            transform: translateY(0);
            background: #00a394;
        }

        .submit-btn.loading .dots span {
            animation: dotFade 1.2s infinite both;
            margin: 0 2px;
            font-size: 0.8rem;
        }
        .submit-btn.loading .dots span:nth-child(2) { animation-delay: 0.2s; }
        .submit-btn.loading .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotFade {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .panel-footer {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body.dark-theme { padding: 14px; }
            .login-panel { padding: 26px 18px; }
        }
    </style>
</head>

<body class="dark-theme">
    <!-- 100% Sharp HTML5 Canvas Live Smart Parking Background -->
    <canvas id="parkingCanvas"></canvas>
    <div class="card-ambient-shadow"></div>

    <!-- Centered Floating Admin Portal Login Panel -->
    <div class="login-wrapper">
        <div class="login-panel">
            <div class="panel-brand">
                <span class="brand-icon-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 3.1C2 11.4 2 11.7 2 12v4c0 .6.4 1 1 1h2"></path>
                        <circle cx="7" cy="17" r="2"></circle>
                        <circle cx="17" cy="17" r="2"></circle>
                    </svg>
                </span>
                SMART PARKING
            </div>

            <div class="portal-tag">ADMIN PORTAL</div>
            <h1 class="portal-heading">Welcome back</h1>
            <p class="portal-desc">Sign in to manage your parking facility.</p>

            <!-- Error Banner -->
            {% if error %}
            <div class="error-alert">
                <span>⚠</span> {{ error }}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="/admin" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" placeholder="Enter username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
            </form>

            <div class="panel-footer">
                Secure parking management access
            </div>
        </div>
    </div>

    <!-- 60 FPS Crisp Retina Smart Parking Facility Script -->
    <script>
        (function() {
            const canvas = document.getElementById('parkingCanvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            let dpr = window.devicePixelRatio || 1;
            let bays = [];
            let vehicles = [];
            let radarX = 0;
            let time = 0;

            const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function resize() {
                dpr = window.devicePixelRatio || 1;
                width = window.innerWidth;
                height = window.innerHeight;

                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';

                ctx.scale(dpr, dpr);
                initLayout();
            }

            function initLayout() {
                bays = [];
                vehicles = [];

                const isMobile = width < 600;
                const cols = isMobile ? 3 : 6; // 6 slots top, 6 slots bottom = 12 total slots

                const bayW = isMobile ? 65 : 85;
                const bayH = isMobile ? 110 : 135;

                const topY = height * 0.12;
                const bottomY = height * 0.68;
                const totalW = cols * bayW + (cols - 1) * (isMobile ? 18 : 36);
                const startX = (width - totalW) / 2;

                let idCounter = 1;

                // Create Top Row (P01 - P06) & Bottom Row (P07 - P12)
                [topY, bottomY].forEach((rowY, rIndex) => {
                    for (let c = 0; c < cols; c++) {
                        const x = startX + c * (bayW + (isMobile ? 18 : 36));
                        let status = 'available';
                        if ((rIndex + c) % 3 === 0) status = 'occupied';
                        else if ((rIndex + c) % 5 === 1) status = 'reserved';

                        bays.push({
                            id: 'P' + String(idCounter++).padStart(2, '0'),
                            x: x,
                            y: rowY,
                            w: bayW,
                            h: bayH,
                            status: status,
                            pulse: Math.random() * Math.PI * 2,
                            isTopRow: rIndex === 0
                        });
                    }
                });

                // Populate Static Parked Vehicles inside Occupied / Reserved Bays
                bays.forEach(bay => {
                    if (bay.status === 'occupied' || bay.status === 'reserved') {
                        const color = bay.status === 'occupied' ? '#FF4D4D' : '#F5A623';
                        vehicles.push({
                            x: bay.x + bay.w / 2,
                            y: bay.y + bay.h / 2,
                            angle: bay.isTopRow ? Math.PI / 2 : -Math.PI / 2,
                            color: color,
                            isMoving: false,
                            targetBay: bay
                        });
                    }
                });

                if (!REDUCED_MOTION) {
                    // Vehicle 1: Cruiser driving left to right along main center lane
                    vehicles.push({
                        x: -100,
                        y: height * 0.48,
                        vx: 2.2,
                        vy: 0,
                        angle: 0,
                        color: '#00BFAE',
                        isMoving: true,
                        state: 'CRUISING'
                    });

                    // Vehicle 2: Dynamic Parker (Drives right to left, turns & parks into an Available bay)
                    const availBay = bays.find(b => b.status === 'available');
                    vehicles.push({
                        x: width + 100,
                        y: height * 0.48 - 15,
                        vx: -1.8,
                        vy: 0,
                        angle: Math.PI,
                        color: '#3b82f6',
                        isMoving: true,
                        state: 'DRIVING_TO_PARK',
                        targetBay: availBay || null
                    });

                    // Vehicle 3: Dynamic Unparker (Starts in Occupied bay, exits & drives away)
                    const occBay = bays.find(b => b.status === 'occupied');
                    if (occBay) {
                        vehicles.push({
                            x: occBay.x + occBay.w / 2,
                            y: occBay.y + occBay.h / 2,
                            vx: 0,
                            vy: 0,
                            angle: occBay.isTopRow ? Math.PI / 2 : -Math.PI / 2,
                            color: '#e11d48',
                            isMoving: true,
                            state: 'WAITING_TO_LEAVE',
                            targetBay: occBay,
                            timer: 150
                        });
                    }
                }
            }

            function drawBackgroundGrid() {
                // Dark Concrete Surface
                ctx.fillStyle = '#071014';
                ctx.fillRect(0, 0, width, height);

                // Driving Lane Boundaries
                const laneTop = height * 0.40;
                const laneBottom = height * 0.60;

                ctx.strokeStyle = 'rgba(0, 191, 174, 0.15)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, laneTop); ctx.lineTo(width, laneTop);
                ctx.moveTo(0, laneBottom); ctx.lineTo(width, laneBottom);
                ctx.stroke();

                // Lane Center Divider Line
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 2;
                ctx.setLineDash([16, 16]);
                ctx.beginPath();
                ctx.moveTo(0, (laneTop + laneBottom) / 2);
                ctx.lineTo(width, (laneTop + laneBottom) / 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // Directional Arrows on Lane Asphalt
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                [width * 0.2, width * 0.8].forEach(arrowX => {
                    ctx.save();
                    ctx.translate(arrowX, (laneTop + laneBottom) / 2 - 12);
                    ctx.beginPath();
                    ctx.moveTo(0, -6); ctx.lineTo(16, 0); ctx.lineTo(0, 6);
                    ctx.closePath(); ctx.fill();
                    ctx.restore();
                });
            }

            function drawParkingBays() {
                time += 0.02;

                bays.forEach(bay => {
                    // Crisp Parking Bay Line Borders
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bay.x, bay.y, bay.w, bay.h);

                    // Slot ID Label
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'center';
                    const textY = bay.isTopRow ? bay.y + 16 : bay.y + bay.h - 10;
                    ctx.fillText(bay.id, bay.x + bay.w / 2, textY);

                    // Determine Status Indicator Color
                    let statusColor = '#00C98B'; // Green Available
                    if (bay.status === 'reserved') statusColor = '#F5A623'; // Amber Reserved
                    if (bay.status === 'occupied') statusColor = '#FF4D4D'; // Red Occupied

                    // Sensor Ring & Central Sensor Dot
                    bay.pulse += 0.035;
                    const sensorY = bay.isTopRow ? bay.y + bay.h - 16 : bay.y + 16;
                    const ringRadius = 5 + Math.sin(bay.pulse) * 2;

                    // Sensor Ring
                    ctx.beginPath();
                    ctx.arc(bay.x + bay.w / 2, sensorY, ringRadius, 0, Math.PI * 2);
                    ctx.fillStyle = statusColor;
                    ctx.globalAlpha = 0.3;
                    ctx.fill();

                    // Central Sensor Dot
                    ctx.beginPath();
                    ctx.arc(bay.x + bay.w / 2, sensorY, 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = statusColor;
                    ctx.globalAlpha = 1.0;
                    ctx.fill();
                });
            }

            function drawVehicle(v) {
                ctx.save();
                ctx.translate(v.x, v.y);
                ctx.rotate(v.angle);

                const w = 46;
                const h = 24;

                // Vehicle Drop Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(-w / 2 + 2, -h / 2 + 3, w, h);

                // Vehicle Body
                ctx.fillStyle = v.color || '#00BFAE';
                ctx.beginPath();
                ctx.roundRect(-w / 2, -h / 2, w, h, 5);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Cabin / Windshield
                ctx.fillStyle = '#090e13';
                ctx.beginPath();
                ctx.roundRect(-w / 4, -h / 2 + 3, w / 2, h - 6, 2);
                ctx.fill();

                // Front Headlights
                ctx.fillStyle = '#fff59d';
                ctx.fillRect(w / 2 - 1, -h / 2 + 3, 2, 4);
                ctx.fillRect(w / 2 - 1, h / 2 - 7, 2, 4);

                // Front Headlight Rays Projection
                const headlightGradient = ctx.createLinearGradient(w / 2, 0, w / 2 + 45, 0);
                headlightGradient.addColorStop(0, 'rgba(255, 245, 157, 0.3)');
                headlightGradient.addColorStop(1, 'transparent');
                ctx.fillStyle = headlightGradient;
                ctx.beginPath();
                ctx.moveTo(w / 2, -h / 2 + 3);
                ctx.lineTo(w / 2 + 45, -h / 2 - 6);
                ctx.lineTo(w / 2 + 45, h / 2 + 6);
                ctx.lineTo(w / 2, h / 2 - 3);
                ctx.closePath();
                ctx.fill();

                // Rear Tail Lights
                ctx.fillStyle = '#ff1744';
                ctx.fillRect(-w / 2 - 1, -h / 2 + 3, 2, 4);
                ctx.fillRect(-w / 2 - 1, h / 2 - 7, 2, 4);

                ctx.restore();
            }

            function updateVehicles() {
                if (REDUCED_MOTION) return;

                vehicles.forEach(v => {
                    if (!v.isMoving) return;

                    // LANE CRUISER
                    if (v.state === 'CRUISING') {
                        v.x += v.vx;
                        if (v.x > width + 100) {
                            v.x = -100;
                        }
                    }

                    // DYNAMIC PARKER (Enters bay & turns sensor Red)
                    if (v.state === 'DRIVING_TO_PARK' && v.targetBay) {
                        const targetX = v.targetBay.x + v.targetBay.w / 2;
                        if (v.x > targetX) {
                            v.x += v.vx;
                        } else {
                            // Turn into target bay
                            const targetAngle = v.targetBay.isTopRow ? -Math.PI / 2 : Math.PI / 2;
                            v.angle += (targetAngle - v.angle) * 0.1;
                            const targetY = v.targetBay.y + v.targetBay.h / 2;
                            v.y += (targetY - v.y) * 0.1;

                            if (Math.abs(v.y - targetY) < 2) {
                                v.isMoving = false;
                                v.state = 'PARKED';
                                v.targetBay.status = 'occupied'; // Sensor changes Green -> Red!
                            }
                        }
                    }

                    // DYNAMIC UNPARKER (Exits bay & turns sensor Green)
                    if (v.state === 'WAITING_TO_LEAVE') {
                        v.timer--;
                        if (v.timer <= 0) {
                            v.state = 'LEAVING_SLOT';
                            if (v.targetBay) {
                                v.targetBay.status = 'available'; // Sensor changes Red -> Green!
                            }
                        }
                    }

                    if (v.state === 'LEAVING_SLOT') {
                        const laneCenterY = height * 0.48 + 15;
                        v.y += (laneCenterY - v.y) * 0.08;
                        v.angle += (0 - v.angle) * 0.08; // Turn right facing forward
                        v.x += 2.2;

                        if (v.x > width + 120) {
                            // Loop back to entry
                            v.x = -100;
                            v.y = height * 0.48;
                            v.angle = 0;
                            v.state = 'CRUISING';
                        }
                    }
                });
            }

            function drawRadarScan() {
                if (REDUCED_MOTION) return;

                radarX += 2.5;
                if (radarX > width + 200) radarX = -200;

                ctx.save();
                const radarGradient = ctx.createLinearGradient(radarX - 100, 0, radarX, 0);
                radarGradient.addColorStop(0, 'transparent');
                radarGradient.addColorStop(0.8, 'rgba(0, 191, 174, 0.08)');
                radarGradient.addColorStop(1, 'rgba(0, 191, 174, 0.35)');

                ctx.fillStyle = radarGradient;
                ctx.fillRect(radarX - 100, 0, 100, height);

                ctx.strokeStyle = 'rgba(0, 191, 174, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(radarX, 0);
                ctx.lineTo(radarX, height);
                ctx.stroke();

                ctx.restore();
            }

            function animate() {
                drawBackgroundGrid();
                drawParkingBays();
                updateVehicles();
                vehicles.forEach(drawVehicle);
                drawRadarScan();

                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            resize();
            animate();

            // Submit Loading animation
            const form = document.getElementById('loginForm');
            const btn = document.getElementById('submitBtn');
            if (form && btn) {
                form.addEventListener('submit', () => {
                    btn.disabled = true;
                    btn.innerHTML = 'Signing In <span class="dots"><span>●</span><span>●</span><span>●</span></span>';
                    btn.classList.add('loading');
                });
            }
        })();
    </script>
</body>

</html>
