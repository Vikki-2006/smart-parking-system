<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Entry - Smart Parking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dark-theme">
    <div class="login-container led-box" style="max-width: 480px;">
        <h1 class="led-text" style="justify-content: center;">
            <span class="status-dot"></span>
            SMART PARKING ENTRY
        </h1>
        <p style="color: var(--muted); margin-bottom: 24px; font-size: 1rem;">Please scan your QR code at the entrance scanner.</p>

        <div style="margin: 32px 0;">
            <div style="width: 200px; height: 200px; border: 2px dashed var(--cyan); border-radius: 16px; margin: 0 auto; display: flex; align-items: center; justify-content: center; background: var(--cyan-bg); box-shadow: 0 0 20px rgba(0, 242, 254, 0.08);">
                <span style="color: var(--cyan); font-family: var(--font-mono); font-size: 1rem; font-weight: 700; letter-spacing: 1px;">SCANNER ACTIVE</span>
            </div>
        </div>

        <div class="success-msg" style="display: none; font-size: 1.2rem; margin-bottom: 24px; font-weight: 700;" id="successMsg">
            ACCESS GRANTED
        </div>

        <a href="/dashboard" class="led-btn sm">BACK TO TERMINAL</a>
    </div>
</body>

</html>
